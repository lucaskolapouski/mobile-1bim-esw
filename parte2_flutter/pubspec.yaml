name: parte2_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# Splash nativa — foto em tela cheia; fundo = cinza da logo (#585858)
flutter_native_splash:
  color: "#585858"
  image: assets/images/splash_logo.png
  android_gravity: fill
  ios_content_mode: scaleAspectFill
  web_image_mode: cover
  fullscreen: true
  android: true
  ios: true
  web: true
  android_12:
    color: "#585858"
    image: assets/images/splash_logo.png
    icon_background_color: "#585858"

# Ícone do app — foreground + fundo cinza da splash (#585858)
flutter_launcher_icons:
  android: true
  ios: false
  web:
    generate: true
    image_path: assets/images/app_icon_foreground.png
    background_color: "#585858"
    theme_color: "#585858"
  image_path: assets/images/app_icon_foreground.png
  adaptive_icon_background: assets/images/app_icon_background.png
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  background_color_ios: "#585858"

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash_logo.png
    - assets/images/app_icon_foreground.png
    - assets/images/app_icon_background.png
